name: pepehub
description: "Offline library and activity journal with Obsidian integration."
publish_to: 'none'
version: 0.25.0+72

environment:
  sdk: ^3.13.3

dependencies:
  archive: ^4.2.0
  xml: ^6.6.1
  html: ^0.15.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  crypto: ^3.0.7
  cryptography: ^2.9.0
  drift: ^2.35.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.1.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  uuid: ^4.6.0
  pdfrx: ^2.6.1
  # Direct PDFium access for image areas in the dark PDF theme (pdfrx worker).
  pdfium_dart: ^0.3.0
  ffi: ^2.2.0
  markdown: ^7.3.1
  enough_convert: ^1.6.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/updater/install-windows.ps1
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/Manrope-OFL.txt
    - assets/fonts/Manrope-FONTLOG.txt
    - assets/fonts/Oswald-OFL.txt
    - assets/fonts/CormorantGaramond-OFL.txt
    - assets/fonts/Onest-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: ReaderLora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald.ttf
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
