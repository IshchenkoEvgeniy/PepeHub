name: Windows release

on:
  push:
    tags:
      - 'v1.13.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Install Flutter packages
        working-directory: apps/pepehub
        run: flutter pub get

      - name: Analyze and run reader tests
        working-directory: apps/pepehub
        run: |
          flutter analyze --no-pub
          flutter test --no-pub test/rich_reader_test.dart test/reader_layout_test.dart

      - name: Build Windows release
        working-directory: apps/pepehub
        run: flutter build windows --release --no-pub

      - name: Package and upload Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $versionLine = Get-Content apps/pepehub/pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $appVersion = (($versionLine -replace '^version:\s*', '') -split '\+')[0].Trim()
          $releaseVersion = $appVersion -replace '^0\.', '1.'
          $artifactName = "PepeHub-$releaseVersion-windows-x64.zip"
          $artifactPath = Join-Path $env:RUNNER_TEMP $artifactName
          $stagingPath = Join-Path $env:RUNNER_TEMP "PepeHub-$releaseVersion-windows-x64"
          $releasePath = Join-Path $env:GITHUB_WORKSPACE 'apps/pepehub/build/windows/x64/runner/Release'
          if (-not (Test-Path (Join-Path $releasePath 'pepehub.exe'))) { throw 'Windows release executable is missing.' }
          New-Item -ItemType Directory -Path $stagingPath -Force | Out-Null
          Copy-Item -Path (Join-Path $releasePath '*') -Destination $stagingPath -Recurse -Force
          Compress-Archive -Path (Join-Path $stagingPath '*') -DestinationPath $artifactPath -CompressionLevel Optimal -Force
          $digest = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $artifactName" | Set-Content -LiteralPath "$artifactPath.sha256" -Encoding ascii
          gh release upload $env:RELEASE_TAG $artifactPath "$artifactPath.sha256" --clobber
